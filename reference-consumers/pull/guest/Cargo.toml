[package]
name = "reference-consumer-pull-guest"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# Own workspace, and separate from `methods/guest` rather than a binary inside
# it. Two reasons, and only the first is the usual one.
#
# It cross-compiles to riscv32im-risc0-zkvm-elf, so it must not be resolved by
# the root workspace, and its `Cargo.lock` is committed.
#
# The second is F9. `methods/guest` depends on `aggregator-program` and
# `kanon-idl`, and `cargo tree` resolves a package rather than a binary, so a
# pull consumer built there would sit in a closure containing the push
# aggregator and the canonical price account with no way to show it did not use
# them. Here the closure is the assertion, the way it already is for `pull-lib`:
# `pull-independence` walks this workspace too. `[M3-06:01]` records it.
[workspace]

[dependencies]
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }

# The consumer's logic. This binary is the SPEL entry point that dispatches on
# it, because the guest is what LEZ executes.
reference-consumer-pull = { path = "..", version = "0.1.0" }

# SPEL, and LEZ's account types under the name SPEL refers to them by. Spelled
# with the tag the root workspace uses: `nssa_core` *is* `lee_core`, and cargo
# only unifies them when the source and tag match character for character.
spel-framework = { git = "https://github.com/logos-co/spel.git", tag = "v0.6.0" }

# `#[lez_program]` with no `instruction` argument generates the instruction enum
# in this file, and the enum it generates derives serde -- so the macro's output
# names a crate this manifest has to carry. `methods/guest` does not, because the
# aggregator points the macro at an enum that already lives in a crate with
# serde. The generated enum is the right choice here: a consumer's instruction
# set has no host-side caller in this repository to share a definition with, and
# a hand-written copy would be a second definition to keep in step.
serde = { version = "1", features = ["derive"] }
nssa_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0", package = "lee_core" }

[dev-dependencies]
# Test-only, and it reaches no shipped build: the handler test builds a trust
# account's bytes directly, because `trust::register` cannot run here (this
# build's `GENESIS_AUTHORITY` is all zeroes, so no config can be established).
borsh = { version = "1", default-features = false, features = ["derive"] }

# The mixed configuration, and it has to be the same one `methods/guest`
# declares: accelerate secp256k1 recovery, leave keccak256 in software. Not a
# style choice duplicated for tidiness -- a consumer verifying a payload runs the
# same recovery the aggregator does, so a different set of patches here would
# make the pull-side cycle figures (M3-08) incomparable with the push-side ones
# and with the cost baseline that recommended this configuration. Guest
# workspaces cannot share a `[patch.crates-io]`, so the pins are repeated;
# `methods/guest/Cargo.toml` carries the reasoning behind the choice, and
# `tests/guest_pins.rs` is what keeps the two copies equal -- a bump on one side
# alone would have the two modes verifying with different implementations of the
# same audit, which is the guarantee ADR 2 exists for.
[patch.crates-io]
k256 = { git = "https://github.com/risc0/RustCrypto-elliptic-curves", tag = "k256/v0.13.3-risczero.1" }
crypto-bigint = { git = "https://github.com/risc0/RustCrypto-crypto-bigint", tag = "v0.5.2-risczero.1" }
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.6-risczero.0" }

[profile.release]
lto = true
codegen-units = 1
