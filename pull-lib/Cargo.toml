# Public-mode pull verification: one call over `verifier-core`, for a consumer
# program that verifies a payload inline rather than reading a published price.
#
# The RFP requires that a consumer using only pull can integrate without
# registering a feed against the aggregator, so this crate must never depend on
# `aggregator-program`. CI asserts that rather than trusting review.
[package]
name = "pull-lib"
description = "Inline RedStone payload verification for public-mode LEZ consumer programs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
verifier-core.workspace = true

# The clock, and the reason it is a dependency rather than a parameter: pull mode
# runs inside a consumer's program, so the consumer is the caller -- and a caller
# that can choose the clock account can make its own staleness check advisory.
# ADR 13's pinning is enforced here for the same reason it is in the aggregator.
kanon-clock.workspace = true

[dev-dependencies]
# The committed RedStone capture is the fixture, read by the shared reader in
# `verifier-core/tests/support/`, which each consumer includes by path.
serde_json = "1"
hex = "0.4"
