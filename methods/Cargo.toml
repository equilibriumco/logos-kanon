# The product guest build. `risc0-build` compiles everything under `guest/` to
# riscv32im-risc0-zkvm-elf and emits an `_ELF` and `_ID` constant per binary,
# which is what the host, the aggregator and the tests reference.
#
# Structurally the same as the `methods-*` crates under `m0/`, with one
# difference that matters: there are three of those because they compare a
# software, an accelerated
# and a mixed configuration, and each needs its own `[patch.crates-io]` and its
# own lockfile. Product code ships one configuration, so there is one methods
# crate here and one guest workspace under it.
[package]
name = "kanon-methods"
description = "RISC Zero guest build for Kanon's product code"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
risc0-build.workspace = true

# For `tests/cost.rs`, which executes the guests it builds. Nothing here is a
# runtime dependency: the crate's job is still to hand out ELFs and image ids.
#
# These tests need the real ELFs, so `RISC0_SKIP_BUILD` makes them meaningless
# and `ci.yml` excludes this crate from `build-test` for that reason.
# `guardrails.yml` runs them instead, with the guest toolchain installed.
[dev-dependencies]
risc0-zkvm.workspace = true
verifier-core.workspace = true
serde_json = "1.0.151"
hex = "0.4"

# For the push-write measurement (M2-18), which has to hand the guest the same
# account bytes LEZ would: a Borsh-encoded `FeedAccount`, a canonical price
# account, and the clock at the address the program is required to read. All
# already in this workspace's graph, so no new package enters the lockfile --
# only three dependency edges under `kanon-methods`, and the package count stays
# at 384.
aggregator-program.workspace = true
kanon-clock.workspace = true
borsh = { workspace = true, features = ["derive"] }

# All three product guests: the aggregator and the two reference consumers. Each
# is its own workspace with its own lockfile and its own `[patch.crates-io]`,
# which is what risc0-build expects and, for the pull consumer, what F9 requires
# -- one sharing a package with `aggregator-program` could not be shown to reach
# no aggregator crate. `[M3-06:01]` records that, and `[M3-05:01]` the reading
# consumer's own reason, which is not a requirement but a claim about what
# reading a price really takes. One methods crate builds all three because a path
# here is resolved against this manifest's directory.
[package.metadata.risc0]
methods = [
  "guest",
  "../reference-consumers/pull/guest",
  "../reference-consumers/aggregator-read/guest",
]
