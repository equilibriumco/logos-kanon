# The guests build in a container (`[M3-08:02]`), and the builder image plus the
# dependency trees it resolves inside itself do not fit beside the runner's
# preinstalled SDKs. The first run of this failed twice on one cause: `no space
# left on device` unpacking the image, and a linker bus error in the job after
# it, which is what ENOSPC looks like from `ld`. None of what is removed is used
# by this repository.
#
# An action rather than a step written out per job: four jobs across three
# workflows pull the same image and need the same headroom, and a job that
# missed an addition here would fail with that same undiagnosable pair.
name: free disk space
description: Reclaim the runner's preinstalled SDKs, for jobs that pull the guest builder image.

runs:
  using: composite
  steps:
    - name: free disk space for the guest builder image
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                    /opt/hostedtoolcache/CodeQL /usr/local/share/boost
        df -h /
