# The product-code gate.
#
# `guardrails.yml` is the other half of CI and answers one question: have the
# measured cycle counts moved. This workflow answers everything else, and the
# split is deliberate. A cycle guardrail failing means "re-measure and re-tag
# deliberately"; a job here failing means "the code is wrong". Mixing them would
# make a red tick ambiguous, and the m0 jobs are the expensive ones, so keeping
# them apart also keeps the fast feedback fast.
#
#   lint          fmt and clippy over everything, host side
#   build-test    the product crates build and their tests pass
#                 (`m0/` is a separate workspace; guardrails.yml runs it)
#   no-std        the guest-reachable crates really are no_std
#   pull-independence  pull reaches no aggregator crate, so pull-only needs no feed
#   guest         product code cross-compiles to riscv32
#   licenses      cargo deny, every workspace: product, m0, guests
#   traceability  the requirement matrix resolves to real evidence
#   sequencer     a standalone LEZ sequencer comes up, and the push path
#                 verifies and publishes across it (`e2e/`, its own workspace)
name: CI

on:
  # Push only, on every branch, and deliberately no `pull_request`.
  #
  # Every branch, because work here happens on branches that may have no pull
  # request, and `workflow_dispatch` alone would not cover it: GitHub only
  # offers manual dispatch for workflows already present on the default branch.
  #
  # No `pull_request`, because for a branch in this repository the push run
  # already reports as a check on any pull request opened from it, so the second
  # trigger would only ever duplicate the first -- two runs, two bills, and a
  # cancelled-vs-failed race between them.
  #
  # The one thing this does not cover is a pull request from a fork, whose
  # pushes do not reach this repository. If that day comes, add `pull_request`
  # and narrow `push` to `main` in the same change: the two settings only make
  # sense as a pair.
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Supersede a branch's own in-flight run, since only its head matters, but let
  # runs on main finish: those are the record of what the default branch did.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: fmt and clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # Every workspace, and the guest is the one that had been missing. `m0/`
      # resolves separately so that its pins can be frozen to the toolchain its
      # published figures were measured on, and each guest resolves separately so
      # it can cross-compile; neither is reached by `--workspace`. Lint is not a
      # figure, though, so it applies to all of them. Adding the guest here found
      # existing drift, which is what an ungated workspace accumulates.
      - name: cargo fmt
        run: |
          cargo fmt --all -- --check
          cargo fmt --all --manifest-path m0/Cargo.toml -- --check
          cargo fmt --all --manifest-path methods/guest/Cargo.toml -- --check
          cargo fmt --all --manifest-path e2e/Cargo.toml -- --check
          cargo fmt --all \
            --manifest-path reference-consumers/pull/guest/Cargo.toml -- --check
          cargo fmt --all \
            --manifest-path reference-consumers/aggregator-read/guest/Cargo.toml -- --check

      # RISC0_SKIP_BUILD is required, not a shortcut. `cargo clippy` exports a
      # rustc wrapper that the guest build inherits, and clippy-driver has no
      # riscv32im-risc0-zkvm-elf std, so the guest build fails with E0463.
      # Skipping it lints the host code, which is all clippy can lint here; the
      # guest code is compiled for real by the `guest` job below.
      - name: cargo clippy
        env:
          RISC0_SKIP_BUILD: 1
        run: |
          cargo clippy --release --workspace --all-targets --locked -- -D warnings
          cargo clippy --release --workspace --all-targets --locked \
            --manifest-path m0/Cargo.toml -- -D warnings
          cargo clippy --release --workspace --all-targets --locked \
            --manifest-path e2e/Cargo.toml -- -D warnings

  build-test:
    name: build and test
    runs-on: ubuntu-24.04
    env:
      RISC0_SKIP_BUILD: 1
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.97.1

      - uses: Swatinem/rust-cache@v2

      - name: cargo build
        run: cargo build --release --workspace --locked

      # `m0/` needs no exclusion here: it is a separate workspace, so
      # `--workspace` does not reach it. Its tests assert exact cycle counts and
      # need the real guest ELFs that RISC0_SKIP_BUILD stubs out, which is why
      # `guardrails.yml` runs them with the guest toolchain installed instead.
      #
      # `kanon-methods` is in this workspace and does need excluding, for the
      # same reason: `methods/tests/cost.rs` executes the guest it measures, and
      # a stubbed ELF has no cycles to count. `guardrails.yml` runs it too.
      - name: cargo test
        run: cargo test --release --locked --workspace --exclude kanon-methods

  no-std:
    name: no_std
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # A bare-metal target with no `std` at all. Building for it is the
      # assertion: `#![no_std]` in the source only says the crate does not
      # *import* std, while a dependency that pulls std back in fails here and
      # nowhere else. `verifier-core` has to stay linkable by a consumer program
      # that does without std, which is the whole point of one shared verifier.
      # `kanon-clock` is here for the same reason: it declares upstream's clock
      # layout rather than importing it precisely so that it can be, and this is
      # what stops someone "simplifying" that back into a `clock_core` import.
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: riscv32im-unknown-none-elf

      - uses: Swatinem/rust-cache@v2

      - name: build the guest-reachable crates for a no_std target
        run: |
          cargo build --release --locked \
            --target riscv32im-unknown-none-elf \
            -p verifier-core -p pull-lib -p kanon-clock

  pull-independence:
    name: pull has no aggregator dependency
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.97.1

      - uses: Swatinem/rust-cache@v2

      # F9: a consumer using only pull integrates without registering a feed
      # against the aggregator. Nothing in `pull-lib`'s signature reaches an
      # aggregator account today, and nothing in the crate would notice if that
      # changed -- a `use kanon_idl::OraclePriceAccount` to borrow a field
      # layout, or an `aggregator_program::FeedAccount` to save declaring a
      # config, would compile and pass every test. So the closure is the
      # assertion, and it is an allow-list rather than a list of crates to
      # refuse: a denylist only catches the reuse someone thought of.
      #
      # What the list covers is every package in the closure that does not come
      # from a registry: this repository's own, and anything reached by path or
      # by git. Stopping at this repository's own packages was not enough, and
      # the hole was the price account itself -- `twap_oracle_core` declares the
      # canonical one, it is a git dependency, and `deny.toml` already allows
      # that source, so a direct dependency on it would have been the aggregator
      # account in `pull-lib` with every gate green.
      #
      # Registry packages stay out of scope, and that is a judgement rather than
      # an oversight: nothing aggregator-side is published, `cargo deny` governs
      # what may come from a registry at all, and pinning `k256`'s transitive
      # set would fail on every upstream bump for no reason this requirement
      # cares about.
      #
      # Three flags carry the rest of it, and the default of each would leave a
      # way past:
      #
      #   --all-features  a dependency can be optional and reached only through
      #                   a feature nobody enables by default. Measured: an
      #                   `optional = true` aggregator dependency behind a
      #                   non-default feature is invisible without this.
      #   --target all    and a dependency can be declared per target. That one
      #                   matters here, because this crate's shipping target is
      #                   a riscv32 guest and not the runner: measured, a
      #                   `cfg(target_arch = "riscv32")` dependency is invisible
      #                   to a host-only walk. It is the runner's own resolution
      #                   either way -- the guest workspace resolves separately
      #                   and this job does not reach it.
      #   --edges         normal,build leaves dev-dependencies out on purpose. A
      #                   test comparing the two paths against each other is
      #                   exactly what M3-04's error-taxonomy parity asks for,
      #                   and it reaches nothing a consumer links.
      #
      # The consumer is checked too, and it is the half the requirement is
      # actually about: `pull-lib` staying clean is worth nothing if the
      # reference consumer has to reach the aggregator anyway. Against the
      # aggregator is the whole of it -- the consumer does register feeds, with
      # its own authority, in accounts it owns, and F9 has nothing to say about
      # that. What it refuses is a dependency on the push mode's price account,
      # so the closure is what the gate reads and not the word "register". Twice, because the
      # consumer is two packages: the logic in the root workspace, and the SPEL
      # program in its own guest workspace. The program is the artefact somebody
      # copies, so it is the one this requirement is really about.
      - name: pull's closure is the verifier and the clock, and nothing else of ours
        run: |
          set -o pipefail

          # Two workspaces, because a walk reaches one resolution. The root
          # workspace holds `pull-lib` and the consumer's logic. The consumer's
          # SPEL program is an excluded workspace with its own lockfile and its
          # own `[patch.crates-io]`, so the third walk below is the only thing
          # that reaches it.
          #
          # That third walk is the reason the consumer guest is not a binary
          # under `methods/guest`. That package depends on `aggregator-program`
          # and `kanon-idl`, and `cargo tree` resolves a package rather than a
          # binary, so a pull consumer living there would sit in a closure
          # holding the push aggregator and the canonical price account with no
          # way to show it did not reach them. `[M3-06:01]` records it.
          #
          # `set -o pipefail` because this workflow sets no `shell:`, so steps run
          # under `bash -e`, which does not enable it. A cargo failure exits 101
          # and `sort` still returns 0, so the closure comes back empty and the
          # `diff` fails -- closed, but with a log that reads as though every
          # package vanished instead of showing what cargo said.
          #
          # A non-registry package renders its source in parentheses: `(/abs/path)`
          # for a path dependency, `(https://...#rev)` for a git one. Registry
          # packages carry no source at all. The scan looks for that source in any
          # field rather than in the third, because cargo puts other parenthesised
          # markers first and the third field is not reliably the source:
          #
          #   spel-framework-macros v0.6.0 (proc-macro) (https://github.com/...)
          #
          # A leaf proc-macro from a path or a git revision would otherwise be
          # dropped as though it came from a registry -- measured, an unlisted
          # local proc-macro crate linked into `pull-lib` left this closure reading
          # exactly the allow-list. The `(*)` dedupe marker and `(proc-macro)` are
          # ignored by the same rule rather than by being named, since neither
          # opens with a path or a scheme.
          #
          # `--color never` against this workflow's `CARGO_TERM_COLOR: always`.
          # Cargo colourises the `(*)` marker and not the source parentheses, so
          # this scan does not actually need the flag: measured, it returns the
          # same allow-list with colour on and the flag removed. It stays because
          # a filter that read `(*)` did need it -- without it five deduped
          # registry packages leaked in -- and this one should not have to care
          # what cargo decides to colour next. The direction is closed either
          # way: a colourised source would match nothing, which drops `pull-lib`
          # itself and fails the diff.
          # Arguments forwarded rather than a package name, so the same filter
          # serves a walk that needs `--manifest-path` for another workspace.
          closure() {
            cargo tree --locked --color never --all-features --target all \
                "$@" --edges normal,build --prefix none \
              | awk '{ for (i = 3; i <= NF; i++) if ($i ~ /^\((\/|http|ssh|git\+)/) { print $1; break } }' \
              | sort -u
          }

          diff <(printf '%s\n' kanon-clock pull-lib verifier-core) \
               <(closure -p pull-lib)

          # The consumer's logic adds LEZ and SPEL and nothing else. That it adds
          # no `kanon-idl` is the load-bearing part: `twap_oracle_core` reaches
          # this repository through that crate and through no other, so the
          # canonical price account stays outside a pull consumer's closure while
          # the account types a program cannot do without come in.
          diff <(printf '%s\n' \
                   kanon-clock \
                   lee_core \
                   pull-lib \
                   reference-consumer-pull \
                   spel-framework \
                   spel-framework-core \
                   spel-framework-macros \
                   verifier-core) \
               <(closure -p reference-consumer-pull)

          # The program itself. `crypto-bigint`, `k256` and `sha2` are the
          # accelerated replacements this guest's `[patch.crates-io]` substitutes
          # for the registry ones, so they arrive by git and the filter sees them;
          # they are the same three `methods/guest` patches, which is deliberate
          # and which that manifest explains. `nssa_core` resolves to `lee_core`
          # and appears under that name, which is also the check that the rename
          # unified rather than duplicating LEZ.
          diff <(printf '%s\n' \
                   crypto-bigint \
                   k256 \
                   kanon-clock \
                   lee_core \
                   pull-lib \
                   reference-consumer-pull \
                   reference-consumer-pull-guest \
                   sha2 \
                   spel-framework \
                   spel-framework-core \
                   spel-framework-macros \
                   verifier-core) \
               <(closure --manifest-path reference-consumers/pull/guest/Cargo.toml \
                         -p reference-consumer-pull-guest)

  guest:
    name: riscv32 guest build
    runs-on: ubuntu-24.04
    env:
      # The guest workspace has its own lockfile, built by risc0-build's nested
      # cargo invocation rather than the outer one, so the outer `--locked` does
      # not reach it. Without this it can silently re-resolve.
      RISC0_BUILD_LOCKED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.97.1

      - uses: Swatinem/rust-cache@v2

      # 3.0.5 here, 3.0.6 in `guardrails.yml`, and the difference is deliberate:
      # the product tracks what LEZ pins, while m0 stays on the toolchain its
      # published figures were measured on. `adr/0008` records the experiment
      # that showed the cycle counts are identical across the two, so the
      # figures stay comparable. rzup resolves releases through api.github.com; the token
      # raises the shared rate limit and needs no scope beyond default read.
      - name: Install RISC Zero toolchain
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L https://risczero.com/install | bash
          echo "$HOME/.risc0/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.risc0/bin:$PATH"
          rzup install cargo-risczero 3.0.5
          rzup install r0vm 3.0.5
          rzup install rust 1.97.0

      # The guests build in a container (`[M3-08:02]`), and the builder image plus
      # the dependency trees it resolves inside itself do not fit beside the
      # runner's preinstalled SDKs. The first run of this failed twice on one
      # cause: `no space left on device` unpacking the image here, and a linker
      # bus error in the job below, which is what ENOSPC looks like from `ld`.
      # None of what is removed is used by this repository.
      - name: free disk space for the guest builder image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      # Cross-compiles all three product guests, which is what `kanon-methods`
      # builds: the aggregator and both reference consumers. Since `[M3-08:02]` they
      # compile inside RISC Zero's builder image, at a fixed path, so the image
      # ids this produces are the ids anybody else's build produces. Docker is
      # preinstalled on the runner; the rzup toolchain above is still required,
      # because `risc0-build` reads its version to compute the guest rustflags
      # even on the container path, and panics if it is absent. The cost baseline
      # proved the toolchain on measurement code; this is the same proof for the
      # crates that ship, and it is where a dependency added to `verifier-core`
      # that turns out not to be guest-compatible fails. For the pull consumer it
      # is also where `pull-lib` and everything under it is shown to reach riscv32
      # without an aggregator crate in the graph -- the closure job says nothing is
      # there, and this says what is there compiles.
      - name: build the product guests
        run: cargo build --release --locked -p kanon-methods

      # The macro-generated half of the SPEL program: the dispatcher, the account
      # constraints and the validator SPEL derives from them. None of it exists
      # before expansion, so no test in the product workspace can reach it, and
      # the build above proves only that it compiles. The guest is an excluded
      # workspace, which is why this needs its own manifest rather than a
      # `--workspace` run.
      - name: test the guests' generated code
        run: |
          cargo test --release --locked \
            --manifest-path methods/guest/Cargo.toml --bin aggregator
          cargo test --release --locked \
            --manifest-path reference-consumers/pull/guest/Cargo.toml \
            --bin pull_consumer
          cargo test --release --locked \
            --manifest-path reference-consumers/aggregator-read/guest/Cargo.toml \
            --bin aggregator_read_consumer

  licenses:
    name: cargo deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.97.1

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.18.2

      # The product workspace, then `m0/`, then every guest workspace. Each
      # resolves separately, with its own lockfile and, for the guests, its own
      # `[patch.crates-io]`, so a copyleft or BUSL crate could enter through any
      # of them without appearing in the product graph at all. The config path
      # has to be absolute, because cargo-deny resolves a relative one against
      # the manifest's directory rather than the working directory.
      - name: cargo deny (every workspace)
        run: |
          set -euo pipefail
          config="$PWD/deny.toml"
          cargo deny check licenses bans sources
          for ws in \
            m0 \
            methods/guest \
            reference-consumers/pull/guest \
            reference-consumers/aggregator-read/guest \
            m0/cost-baseline/methods-software/guest \
            m0/cost-baseline/methods-accelerated/guest \
            m0/cost-baseline/methods-mixed/guest \
            m0/lez-probe/methods-accelerated/guest \
            m0/lez-probe/methods-mixed/guest \
            e2e
          do
            echo "::group::cargo deny $ws"
            cargo deny --manifest-path "$ws/Cargo.toml" \
              check --config "$config" licenses bans sources
            echo "::endgroup::"
          done

      # Advisories are a different concern from licensing and are reported
      # rather than gating, for one specific reason: the check depends on an
      # advisory database that is fetched fresh on every run, so an advisory
      # filed this morning against a transitive dependency would fail the
      # licence gate. Failing loudly on a real vulnerability is right; blocking
      # a licence check on database drift is not.
      - name: cargo deny advisories (informational)
        continue-on-error: true
        run: cargo deny check advisories

  traceability:
    name: traceability matrix
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.97.1

      - uses: Swatinem/rust-cache@v2

      # Fails if a requirement has no row, if a row names a test, CI job or
      # document that does not exist, or if TRACEABILITY.md no longer matches
      # its sources. A later task requires every row to read
      # `verified`; this is what stops that from being claimed without evidence.
      - name: cargo test -p traceability
        run: cargo test --locked -p traceability

  sequencer:
    name: standalone LEZ sequencer
    runs-on: ubuntu-24.04
    # LEZ itself is still never built here: a cold source build ran past 90
    # minutes and was killed, and because a timeout cancels the job before the
    # cache is written it could never warm up, so `lez-sequencer-image.yml`
    # absorbs that build once per revision and this pulls the result.
    #
    # What is compiled here is Kanon's own end-to-end test and the guest it
    # deploys, which M2-19 added. That is the reason for the toolchain steps
    # below and for the budget: the test's own workspace resolves the sequencer's
    # RPC client, which is a large graph, so the first run on a cold cache is
    # the expensive one.
    timeout-minutes: 45
    env:
      # Each guest carries the account id of its suite's fixed key as its genesis
      # authority. Without it that program cannot be initialised by anyone, which
      # is `[M2-06:01]` working as designed and is why each test refuses to run
      # against an unconfigured build. Both keys are `[0x11; 32]` and `[0x22; 32]`,
      # each signs for one account on a throwaway chain, and neither controls
      # anything. Cargo runs the two test binaries one after another against the
      # same chain, so the second meets whatever the first left behind; a key
      # each keeps a suite's accounts its own.
      #
      # Both are set here rather than one per step, because `kanon-methods`
      # builds all three guests in one invocation and each reads its own.
      KANON_GENESIS_ADMIN: 5b0e4f6dddea8b9ef3118d6002a25c09ab379653ffb60586f4604f1fa6a0b392
      KANON_PULL_GENESIS_AUTHORITY: 8536b4cd1b24c4af1df73f6b509eadc2d26bebc1f94d10253658419fe643e197
      RISC0_BUILD_LOCKED: 1
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.97.1

      # `e2e` only, and deliberately not the product workspace. Everything this
      # job builds goes to `e2e/target`, and caching `./target` actively breaks
      # it: `lez-sequencer.sh` keeps its run state in `target/lez-sequencer`,
      # rust-cache saved that directory at the end of a green run but pruned the
      # `.kanon-sequencer-state` marker inside it, and the next run's `start`
      # then found a state directory it could not prove it owned and refused to
      # delete it -- correctly. Cold cache passed, the run after it failed.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: e2e

      # The same toolchain the `guest` job installs, and for the same reason:
      # the test deploys a real guest ELF, so the guest has to be cross-compiled
      # here rather than stubbed with RISC0_SKIP_BUILD.
      - name: Install RISC Zero toolchain
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L https://risczero.com/install | bash
          echo "$HOME/.risc0/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.risc0/bin:$PATH"
          rzup install cargo-risczero 3.0.5
          rzup install r0vm 3.0.5
          rzup install rust 1.97.0

      # Before the sequencer starts, so a compile error is not reported as a
      # chain that would not come up.
      # The guests build in a container (`[M3-08:02]`), and the builder image plus
      # the dependency trees it resolves inside itself do not fit beside the
      # runner's preinstalled SDKs. The first run of this failed twice on one
      # cause: `no space left on device` unpacking the image here, and a linker
      # bus error in the job below, which is what ENOSPC looks like from `ld`.
      # None of what is removed is used by this repository.
      - name: free disk space for the guest builder image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Build the end-to-end test
        run: cargo test --manifest-path e2e/Cargo.toml --locked --no-run

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Fails with a message naming the publish workflow when no image exists
      # for the revision the product resolves, which is what a pin bump looks
      # like. Better than silently starting an hour-long build.
      #
      # Still wanted now that `start` runs the image rather than a binary out of
      # it: Bedrock's compose file is LEZ's own and `docker compose` reads it from
      # the host, so a checkout has to exist either way.
      - name: Fetch the prebuilt sequencer
        run: scripts/lez-sequencer.sh fetch

      # Both services are containers: Bedrock from the image LEZ's own compose
      # file names, the sequencer from the image published for this revision
      # (adr/0034). So this is LEZ's stack rather than an approximation of it.
      # `lgs test-node` is not used and cannot be: see the header of the script,
      # and adr/0012.
      - name: Start bedrock and the sequencer
        run: scripts/lez-sequencer.sh start

      - name: Smoke the sequencer
        run: scripts/lez-sequencer.sh smoke

      # M2's done gate: the push path verifying and publishing across this
      # sequencer. `start` above gives a clean chain, so the test deploys,
      # claims, initialises, registers and submits from nothing every run --
      # which is what makes its assertions about state rather than about
      # whatever a previous run left behind.
      # Both suites, in one invocation: cargo runs the two test binaries one
      # after another, each driving its own program under its own key.
      - name: Verify and publish, and verify and settle, end to end
        run: cargo test --manifest-path e2e/Cargo.toml --locked

      - name: Sequencer log
        if: always()
