# M0-10: CI-pinned guardrails on the measured cycle counts.
#
# The guardrail tests assert exact cycle counts, so this workflow is what makes
# them a regression gate rather than a thing someone remembers to run. It is also
# the standing check on M0-11's cross-architecture claim: the x86_64 and ARM64 jobs
# assert the same constants, so if the figures ever stop being architecture
# independent, that shows up here rather than in a footnote.
#
# Proving is excluded. It takes minutes per sample and is hardware dependent, which
# is neither cheap enough nor deterministic enough for CI; those tests are
# `#[ignore]`d and run by hand. Everything CI asserts is deterministic, and a
# failure means a real change in the numbers.
name: guardrails

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A guardrail failure should report every figure that moved, not just the first.
  RUST_BACKTRACE: 1
  # The guest workspaces have their own lockfiles, built by risc0-build's nested
  # cargo invocation rather than the outer one, so the outer `--locked` does not
  # reach them. Without this they can silently re-resolve, and since the guest ELF
  # is what the cycle counts measure, that is the one place drift matters most.
  RISC0_BUILD_LOCKED: 1

jobs:
  guardrails:
    name: cycles (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report both architectures even when one fails: which ones moved is the
      # first thing worth knowing.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          # The ARM64 half of the reproducibility claim. macOS runners are billed
          # at a premium on private repos, so this leg is gated below to pushes to
          # main and manual runs rather than every PR.
          - os: macos-14
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Skip ARM64 on pull requests
        id: gate
        shell: bash
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ] && [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # Host toolchain. Pinned, though the numbers do not depend on it: Ubuntu at
      # 1.93.0 and 1.97.1 gave identical cycle counts, because the host compiler
      # builds only the driver. Pinned anyway so a host-side compile error is
      # attributable.
      - name: Install host Rust 1.97.1
        if: steps.gate.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt

      # The guest toolchain, which the numbers *do* depend on. Versions come from
      # m0/versions.md; a bump there without a bump here would silently measure
      # something else.
      # rzup resolves releases through api.github.com. Unauthenticated, that shares a
      # rate limit with every other job on the runner's IP, which fails intermittently
      # on hosted macOS in particular. The token raises the limit; no extra scope is
      # needed beyond the default read access.
      - name: Install RISC Zero toolchain
        if: steps.gate.outputs.run == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L https://risczero.com/install | bash
          echo "$HOME/.risc0/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.risc0/bin:$PATH"
          rzup install cargo-risczero 3.0.6
          rzup install r0vm 3.0.6
          rzup install rust 1.97.0

      - name: Record the environment
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          rustc --version
          r0vm --version
          rzup show

      # Guest ELFs are the expensive part of the build and change only when the
      # guest sources or the pinned versions do, so they are keyed on the manifests
      # and lockfiles.
      - name: Cache cargo and guest builds
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-guardrails-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: ${{ matrix.os }}-guardrails-

      # `--locked` is the assertion that the committed lockfiles are complete and
      # current. Without it CI would re-resolve and could measure a different
      # dependency set than the one m0/versions.md documents, which is precisely the
      # drift the exact pins exist to prevent.
      - name: guardrails, both projects
        if: steps.gate.outputs.run == 'true'
        run: cargo test --release --locked --workspace

  lint:
    name: fmt and clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt

      - name: cargo fmt
        run: cargo fmt --all -- --check

      # RISC0_SKIP_BUILD is required, not a shortcut. `cargo clippy` exports a
      # rustc wrapper that the guest build inherits, and clippy-driver has no
      # riscv32im-risc0-zkvm-elf std, so the guest build fails with E0463. Skipping
      # it lints the host code, which is all clippy can lint here; the guest code is
      # compiled for real by the guardrail jobs above.
      - name: cargo clippy
        env:
          RISC0_SKIP_BUILD: 1
        run: cargo clippy --release --workspace --all-targets -- -D warnings
