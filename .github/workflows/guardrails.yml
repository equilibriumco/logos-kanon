# CI-pinned guardrails on the measured cycle counts.
#
# The guardrail tests assert exact cycle counts, so this workflow is what makes
# them a regression gate rather than a step that depends on being remembered.
#
# x86_64 only. The figures were established to be architecture independent
# by measuring them on three machines across two architectures, and that finding
# stands in the report; what is gone is the *standing* ARM64 check. It was a
# exercise, ARM64 is not a delivery target, and a premium macOS runner on every
# push is a real cost for re-confirming a settled result. Re-add a matrix here if
# ARM64 ever becomes a target again.
#
# Proving is excluded. It takes minutes per sample and is hardware dependent, which
# is neither cheap enough nor deterministic enough for CI; those tests are
# `#[ignore]`d and run by hand. Everything CI asserts is deterministic, and a
# failure means a real change in the numbers.
name: guardrails

on:
  # Push only, on every branch, and deliberately no `pull_request`.
  #
  # Every branch, because work here happens on branches that may have no pull
  # request, and `workflow_dispatch` alone would not cover it: GitHub only
  # offers manual dispatch for workflows already present on the default branch.
  #
  # No `pull_request`, because for a branch in this repository the push run
  # already reports as a check on any pull request opened from it, so the second
  # trigger would only ever duplicate the first -- two runs, two bills, and a
  # cancelled-vs-failed race between them.
  #
  # The one thing this does not cover is a pull request from a fork, whose
  # pushes do not reach this repository. If that day comes, add `pull_request`
  # and narrow `push` to `main` in the same change: the two settings only make
  # sense as a pair.
  push:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # A guardrail failure should report every figure that moved, not just the first.
  RUST_BACKTRACE: 1
  # The guest workspaces have their own lockfiles, built by risc0-build's nested
  # cargo invocation rather than the outer one, so the outer `--locked` does not
  # reach them. Without this they can silently re-resolve, and since the guest ELF
  # is what the cycle counts measure, that is the one place drift matters most.
  RISC0_BUILD_LOCKED: 1

concurrency:
  group: guardrails-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  guardrails:
    name: cycles
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Host toolchain. Pinned, though the numbers do not depend on it: Ubuntu at
      # 1.93.0 and 1.97.1 gave identical cycle counts, because the host compiler
      # builds only the driver. Pinned anyway so a host-side compile error is
      # attributable.
      - name: Install host Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt

      # The guest toolchain, which the numbers *do* depend on. Versions come from
      # m0/versions.md; a bump there without a bump here would silently measure
      # something else.
      # rzup resolves releases through api.github.com. Unauthenticated, that shares a
      # rate limit with every other job on the runner's IP. The token raises the
      # limit; no extra scope is needed beyond the default read access.
      - name: Install RISC Zero toolchain
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L https://risczero.com/install | bash
          echo "$HOME/.risc0/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.risc0/bin:$PATH"
          rzup install cargo-risczero 3.0.6
          rzup install r0vm 3.0.6
          rzup install rust 1.97.0

      - name: Record the environment
        shell: bash
        run: |
          rustc --version
          r0vm --version
          rzup show

      # Guest ELFs are the expensive part of the build and change only when the
      # guest sources or the pinned versions do, so they are keyed on the manifests
      # and lockfiles.
      - name: Cache cargo and guest builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: guardrails-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: guardrails-${{ runner.os }}-

      # `--locked` is the assertion that the committed lockfiles are complete and
      # current. Without it CI would re-resolve and could measure a different
      # dependency set than the one m0/versions.md documents, which is precisely the
      # drift the exact pins exist to prevent.
      - name: guardrails, both projects
        run: cargo test --release --locked --workspace --manifest-path m0/Cargo.toml

  # fmt and clippy used to live here. They moved to `ci.yml` because
  # they lint product code as much as m0's, and this workflow is the cycle gate:
  # a red tick here should mean a figure moved, not that a line was too long.
