# The product workspace: `verifier-core` and the crates around it, which are what
# ships.
#
# `m0/` is a workspace of its own, and the separation is load-bearing rather than
# tidiness. The measurement workspace is delivered: its figures are published,
# and they are a property of
# an exact toolchain, so its pins must never move. Product pins must move, because
# the product tracks a live LEZ and a live SPEL. Sharing one lockfile means the two
# constrain each other -- a product bump is a re-measurement risk, and a frozen
# freeze is a ceiling on the product. Two lockfiles let each move on its own terms.
#
# The cost is that `cargo test --workspace` no longer runs everything. CI runs both,
# `guardrails.yml` for `m0/` and `ci.yml` for here, which is the split those two
# workflows already had.
#
# Guest crates are deliberately absent from `members`. Each cross-compiles to
# riscv32im-risc0-zkvm-elf and carries its own `[patch.crates-io]` and its own
# lockfile, which under `m0/` is the mechanism that distinguishes the software,
# accelerated and mixed configurations from one another. They are built by
# `risc0-build` from the `methods*` build scripts, under their own resolution, and
# must stay that way: folding them in would collapse the three configurations into
# one.
[workspace]
resolver = "2"
members = [
  # Product crates. Each carries a doc comment
  # naming the tasks that fill it, and `TRACEABILITY.md` maps them to
  # requirements.
  "verifier-core",
  "methods",
  "pull-lib",
  "aggregator-program",
  "kanon-clock",
  "kanon-idl",
  "kanon-sdk",
  "kanon-relayer",
  "reference-consumers/aggregator-read",
  "reference-consumers/pull",
  "traceability",
]
exclude = [
  # The measurement workspace, with its own `Cargo.lock` and its own pins.
  "m0",

  # Guest workspace: cross-compiles to riscv32im-risc0-zkvm-elf and is built by
  # `risc0-build` from `methods`' build script, under its own resolution and its
  # own lockfile.
  "methods/guest",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# The product crates, declared once so a member says `verifier-core.workspace =
# true` and nothing has to repeat a path or a version. Each carries a version
# requirement as well as a path: a bare path dependency is a wildcard, and
# `cargo deny`'s wildcard ban is kept strict, since a `*` requirement on
# anything published resolves to whatever exists at build time.
verifier-core = { path = "verifier-core", version = "0.1.0" }
pull-lib = { path = "pull-lib", version = "0.1.0" }
kanon-clock = { path = "kanon-clock", version = "0.1.0" }
kanon-idl = { path = "kanon-idl", version = "0.1.0" }
kanon-sdk = { path = "kanon-sdk", version = "0.1.0" }

# LEZ, and the canonical price account the aggregator is required to populate. Both come from Logos, and the two pins are one decision
# rather than two: `twap_oracle_core` pins `lee_core` by tag v0.2.0, and cargo does
# not unify a `tag` source with a `rev` source even when both name the same commit,
# so the pin here has to be spelled identically or the guest links two incompatible
# `AccountId` types.
#
# That is why the product is on LEZ v0.2.0 while `m0/` stays at v0.2.1: the product
# tracks the LEZ that the programs it interoperates with are built against, and m0
# tracks the LEZ its published figures were measured against. The workspace split is
# what lets those be different answers.
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0" }
clock_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.0" }

# Only for `kanon-clock`'s conformance test, which encodes a clock account the
# way upstream does and checks that the declared layout reads it. Pinned to what
# the LEZ graph already resolves, so it adds no new version to the tree.
borsh = "1.8.0"

# SPEL, for the aggregator. Only the macro crate here: `#[account_type]` is a
# no-op the IDL generator reads, and the instruction enum needs nothing else, so
# the core crate carries no framework runtime. The guest takes the full
# framework, where the program actually runs.
#
# Spelled by the same tag the graph already resolves through `twap_oracle_core`,
# which is what keeps one SPEL in the tree: a second revision would give the
# guest two `AccountId` types, the hazard the `lee_core` note above describes.
spel-framework-macros = { git = "https://github.com/logos-co/spel.git", tag = "v0.6.0" }
spel-framework = { git = "https://github.com/logos-co/spel.git", tag = "v0.6.0" }
serde = { version = "1", features = ["derive"] }
twap_oracle_core = { git = "https://github.com/logos-blockchain/lez-programs", rev = "4363f13912e0ba8627e70575161862ab337c1169" }

# Exact, not a caret range, and deliberately 3.0.5 where `m0/Cargo.toml` says 3.0.6.
# Two pins because they answer two questions. The measurement pin is frozen to
# the toolchain its published figures were measured on. This one tracks what LEZ
# pins, which is 3.0.5: `lee_core` treats it as a floor rather than a ceiling, so
# the baseline was free to take 3.0.6 and did, but everything Logos ships -- LEZ,
# `lez-programs`, `twap_oracle_core` -- is on 3.0.5, and an exact pin above the
# estate's is what made the canonical price account crate unresolvable against
# this graph.
#
# The figures stay comparable: m0's guardrails were run against 3.0.5 and every
# published cycle count was unchanged,
# even though the guest image ID moves. `adr/0008-exact-pins-and-tracking-the-estate.md`
# records the experiment and what it settled.
#
# `client` and no more. The default set adds `bonsai`, whose remote proving
# client drags an HTTP and TLS stack into the lockfile for a service this
# repository does not call; `client` alone carries the local executor, which is
# all `methods/tests/cost.rs` needs.
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["client"] }
risc0-build = "=3.0.5"
