[package]
name = "bip340-bench-guest"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# Own workspace and own lockfile, like every other guest here: it
# cross-compiles to riscv32im-risc0-zkvm-elf, and the ELF is what the figures
# are a property of.
[workspace]

[dependencies]
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }

# The backend under measurement. `bip340` is the feature that pulls in the
# module and the SHA-256 the challenge needs; the product guests leave it off,
# which is what keeps their ELFs unchanged by any of this.
verifier-core = { path = "../../verifier-core", version = "0.1.0", features = ["bip340"] }

# The reference implementation, measured in the same ELF over the same cases so
# the comparison is one subtraction rather than two runs.
k256 = { version = "=0.13.3", default-features = false, features = ["ecdsa", "arithmetic", "schnorr"] }

# The same accelerated forks the product guests patch to, so the reference arm
# is the accelerated `k256` path and not a software one.
[patch.crates-io]
k256 = { git = "https://github.com/risc0/RustCrypto-elliptic-curves", tag = "k256/v0.13.3-risczero.1" }
crypto-bigint = { git = "https://github.com/risc0/RustCrypto-crypto-bigint", tag = "v0.5.2-risczero.1" }
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.6-risczero.0" }
tiny-keccak = { git = "https://github.com/risc0/tiny-keccak", tag = "tiny-keccak/v2.0.2-risczero.0" }

[profile.release]
lto = true
codegen-units = 1
