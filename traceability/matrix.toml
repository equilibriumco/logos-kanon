# ---------------------------------------------------------------- Adaptor Security

[[row]]
id = "SEC1"
status = "partial"
tasks = ["M1-13", "M1-22", "M2-13", "M3-03"]
implemented_in = ["verifier-core"]
verified_by = [
  "test:an_unknown_signer_rejects_the_payload_even_when_quorum_is_present",
  "test:an_unauthorised_signer_is_reported_directly",
]
note = "Both modes share one membership check in `verifier-core`. Every package carrying the requested feed is recovered and its signer must be in the configured set; the first unknown signer returns `UnauthorisedSigner` even when authorised packages already meet quorum. Packages for other feeds remain irrelevant and are skipped before recovery. ADR 15 records why this follows SEC1's literal contract and why a malicious submitter causing its own transaction to fail is not a feed-wide denial of service. Push and pull integration evidence remains M2-13 and M3-03, so the row stays partial."

[[row]]
id = "SEC2"
status = "planned"
tasks = ["M1-07", "M2-08", "M2-14", "M3-03"]
implemented_in = ["aggregator-program", "pull-lib"]
verified_by = []
note = "Two distinct obligations. Push: only the admin authority may update the stored set, and the update path itself is tested (M2-14). Pull: the set is the consumer's, and the library must never accept one sourced from the payload (M3-03)."

[[row]]
id = "SEC3"
status = "partial"
tasks = ["M1-14", "M1-15", "M2-17"]
implemented_in = ["kanon-clock", "verifier-core"]
verified_by = [
  "test:any_other_account_is_refused_before_its_contents_are_read",
  "test:a_replayed_payload_is_refused_however_well_signed_it_is",
  "test:a_clock_that_cannot_be_read_refuses_rather_than_guesses",
  "test:a_max_age_wider_than_redstones_own_default_is_rejected",
  "test:the_ceiling_matches_redstones_own_default",
  "test:two_compromised_signers_decide_a_threshold_of_three",
  "test:signers_below_the_bar_still_choose_which_honest_report_wins",
  "test:a_threshold_of_four_is_no_harder_to_move_than_a_threshold_of_three",
  "test:a_threshold_of_five_needs_three_compromised_signers",
  "test:a_threshold_of_seven_needs_four_and_the_pattern_does_not_stop_at_five",
  "doc:MANIPULATION-ANALYSIS.md",
]
note = "M2-17 delivered the document, `MANIPULATION-ANALYSIS.md`: the `maxAge` recommendation and the analysis of signer compromise, replay and signer-set update delays. The window it reasons over is bounded at both ends now. `MAX_MAX_AGE_MS` is fifteen minutes, the default RedStone's own validator falls back to, so no feed may be looser than the upstream fallback. It is enforced rather than published because a `maxAge` past it degrades the check smoothly and never visibly breaks: at a year the window admits every real package without saturating at all, and only at the extreme does `freshness` saturate outright (ADR 29). Replay splits three ways and the document says so: a package replayed into a payload built around another moment refuses that payload (ADR 27), a replay whose packages fall outside the window is `StalePackage`, and an intact in-window round verifies -- its packages agree about the moment and its signatures are genuine, so what bounds it is `maxAge` together with the aggregator refusing a timestamp no newer than the stored one. `a_replayed_payload_is_refused_however_well_signed_it_is` covers the out-of-window case only, and its first assertion is the intact payload verifying. Staleness itself cannot be defeated because the clock is the pinned every-block account and no caller may substitute another, and a clock that cannot be read refuses rather than guesses, since verifying without one accepts a package of any age. The row stays partial for one reason: the recommended floor is provisional, because none of its three terms has a measurement. M2-00 captures the upstream publish intervals, a relayer has to exist before submission latency can be timed, and the skew between a signer's clock and the sequencer's is unmeasured and unbounded -- RedStone's three-minute forward tolerance is their default for the other side of the window, not a limit on a signer. The analysis also corrects the reading of the threshold that F3's wording invites: the price is a median, so two compromised keys control a 3-of-N feed rather than three. Four tests hold that arithmetic, one per row of the document's table, including the one showing a threshold of four is no harder to move than three, because an even count averages the middle two, and the one showing seven needs four, so the ratio does not improve as the threshold grows. Pull's weaker position is stated in the document plainly: a pull consumer keeps its own signer set fresh, because it bypasses the centrally administered one, and no admin transaction can reach it."

# --------------------------------------------------------------------- Open source

[[row]]
id = "OS1"
status = "partial"
tasks = ["M1-02", "M1-04"]
implemented_in = ["LICENSE-MIT", "LICENSE-APACHE", "NOTICE", "deny.toml"]
verified_by = [
  "ci:licenses",
  "doc:LICENSE-MIT",
  "doc:LICENSE-APACHE",
  "doc:NOTICE",
]
note = "The dual licence and the mechanical gate are done: `cargo deny check licenses` runs on every pull request over the whole graph, transitive dependencies included, and BUSL-1.1 is denied outright, which is also what enforces the RedStone boundary. What is not done is the requirement's second half. It asks for **no copyleft dependency, transitive ones included**, and the gate currently passes because copyleft is admitted by named exception rather than absent. Nothing copyleft is linked into a shipped artefact, which is the reassuring half and worth stating precisely rather than generously: the LGPL-3.0 family (`malachite` and its four siblings, plus `downloader`) appears in `m0/Cargo.lock` only, reached through risc0 proving, and is absent from the product lockfile entirely; `option-ext` is MPL-2.0 and reaches the product graph as a *build* dependency only, through `risc0-build` -> `dirs` -> `dirs-sys`, so it runs during a build and links into nothing. What remains is that the exceptions exist, so passing CI proves the gate is enforced rather than that the requirement is met, and a `verified` row would claim the latter on the strength of the former. It stays `partial` until Logos rules on whether build-time and measurement-only copyleft satisfies the requirement's *transitive ones included*. See *Open: the LGPL-3.0 dependency in LEZ's host graph* in `m0/versions.md`."

