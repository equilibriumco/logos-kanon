  "test:the_median_does_not_depend_on_the_order_the_reports_arrived_in",
  "test:a_corrupted_payload_is_answered_rather_than_panicked_on",
]
note = "This matrix is the requirement's own instrument. It is `partial` by construction until M5-06 leaves every row verified; the checker is what stops that from being asserted without evidence. S3 asks for valid-signature acceptance and invalid-signature rejection specifically: M1-21 verifies RedStone's published signatures over their published packages, while ADR 15 adds a payload with an unrecoverable signature alongside an otherwise valid quorum and requires `InvalidSignature`. M1-24 adds the coverage an example cannot give: the threshold, the framing and the scale conversion are claims about every input, and `verifier-core/src/properties.rs` generates them (ADR 21). The last of those tests is the one that matters most for a guest, since ADR 4 makes a panic on a malformed payload an aborted transaction rather than a rejection."

