[[row]]
id = "P1"
status = "partial"
tasks = ["M2-02", "M2-19", "M3-06"]
implemented_in = ["m0/lez-probe"]
verified_by = [
  "test:a_3_of_n_update_leaves_ample_budget_headroom",
  "doc:m0/M0-report.pdf",
]
note = "M0 measured a 3-of-N update at 1,906,737 cycles against LEZ's 32M per-transaction budget, 5.68%, and pinned it with a guardrail test. What is still open is the shipping path in one real transaction, per mode: M2-02 and M2-19 for push, M3-06 for pull."

[[row]]
id = "P2"
status = "partial"
tasks = ["M1-25", "M2-18", "M3-08", "M3-10", "M5-07"]
implemented_in = ["m0/cost-baseline", "m0/lez-probe"]
verified_by = [
  "test:recovery_cycles_are_unchanged",
  "test:keccak_cycles_per_hash_are_unchanged",
  "test:full_update_cycles_are_unchanged",
  "test:accelerated_configuration_cycles_are_unchanged",
  "test:proof_sizes_distinguish_the_configurations",
  "test:instruction_handling_cost_is_unchanged",
  "test:per_signer_cost_is_linear",
  "ci:guardrails",
  "doc:m0/M0-report.pdf",
]
note = "\"Reproducible from the test suite\" is satisfied the strict way: every published figure is asserted by exact equality and runs in CI on x86_64. The per-component split is measured rather than inferred: `lez_plumbing` is a third guest identical to `lez_verify` with the cryptography removed, so the framework's per-package instruction handling is subtracted directly instead of being left in a residual, and `instruction_handling_cost_is_unchanged` pins it. Without that separation, drift in the framework's cost is silently reattributed to recovery. The cross-architecture finding (M0-11) stands in the report, measured across three machines; ARM64 is not a delivery target and is no longer re-checked on every push. Still to come are the per-component table on product code (M1-25), the push write (M2-18), the pull per-read (M3-08) and byte accounting (M3-10)."

