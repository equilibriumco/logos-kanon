tasks = ["M1-08", "M1-12", "M1-14", "M1-15", "M1-16", "M1-17", "M1-21"]
implemented_in = ["verifier-core", "kanon-clock"]
verified_by = [
  "test:the_signed_span_covers_the_points_and_the_three_trailing_fields",
  "test:truncation_at_every_length_is_rejected_rather_than_panicking",
