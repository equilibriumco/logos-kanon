note = "M2-00 confirmed all five feeds are published on `redstone-primary-prod`, including the two privacy assets that could not be assumed, and `FEEDS.md` records what it found. One roster of five signers covers all five feeds, every address recovered from the package signature rather than read off the gateway's label, because the roster is what a feed is registered with. Sharing a roster turned out to be a property of the data service and not of these five: a sweep of all 878 feeds it serves found one roster and no exception. The set is the observed one and not an authorised one -- a signer authorised upstream but silent through the sample would not appear -- so M2-08 remains the path for what the observation missed. Rounds land every ten seconds nominally, but three of twenty-six intervals in the sample were double that and an earlier sample held one of thirty seconds, so what a staleness floor has to clear is the worst gap and five minutes only bounds it from below. ADR 30 records why the identical rosters are still stored per feed. The row stays partial until M2-11 registers the five on devnet and M2-12 exercises them end to end."

