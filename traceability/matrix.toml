note = "The account is RFP-019's, re-exported rather than forked (M1-09), and `publish` decides what goes in its six fields. `source_id` is the constant F5 names: `RedStone`, ASCII right-padded, so a consumer checking where a price came from needs nothing from this repository to construct it. ADR 22 records the decision, including why the writer's own identity was the wrong answer: `source_id` is one of the three identifiers `publish` refuses to overwrite, so an identifier that moved with the program id would leave a rebuilt adaptor unable to update the accounts it created. The pair comes from the registration claim (M1-16), the price is the median on the account's Q64.64 scale (M1-17), the timestamp is the observation's and not the write's, and the confidence interval is zero because RedStone publishes none. M1-26 conforms the layout in both directions. What remains is M2-02: the instruction that calls `publish` inside a real transaction."

