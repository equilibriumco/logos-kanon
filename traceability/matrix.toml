# Requirement to implementation to evidence, one row per entry in
# `requirements.toml`.
#
# This is the source; `TRACEABILITY.md` at the repo root is rendered from it and
# CI fails if the two disagree, so the readable version cannot drift from the
# checked one. `tests/matrix.rs` is what makes the file a gate rather than a
# table: every `verified_by` entry has to resolve to something that exists, and
# every path in `implemented_in` has to be a real directory or file.
#
# status
#   planned   nothing implemented yet; `tasks` says which task will
#   partial   partly satisfied, or satisfied by M0 evidence that later tasks
#             extend; needs at least one piece of evidence
#   verified  satisfied now, with at least one test or CI gate standing behind
#             it (a document alone is never enough)
#
# verified_by entries
#   test:<fn>    a test function that exists in this repository
#   ci:<job>     a job id in `.github/workflows/`
#   doc:<path>   a delivered document, checked to exist
#
# M1-06 seeded this file and its checker. M5-06 is the task that has to leave
# every row `verified`, which is why the checker is strict about evidence now
# rather than at the end: a row cannot be quietly marked verified without
# something a test run can point at.

