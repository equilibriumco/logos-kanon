note = "`verify_feed` enforces M-of-N over distinct authorised signers: one slot per configured signer, so a signer counts once however many packages it sends (M1-13). A second package from a slotted signer is skipped rather than fatal -- ADR 24 records why, and the tests cover both ways an attacker can produce a duplicate without a key. Which of a signer's packages fills its slot is settled by ADR 27 rather than by ADR 24's freshest rule: the price comes from one round, chosen as the timestamp the most distinct configured signers agree on, and one package files one report however many times it repeats the feed. M1-23 pins the boundaries where an off-by-one would live -- M, M-1, one, and unanimity. ADR 15 records the contract's strict package checks before the threshold is evaluated."

