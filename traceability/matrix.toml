note = "Four rejection classes in one requirement. The malformed-wire-format one has landed: M1-12 decodes zero-copy, bounds-checks every length, and is tested against truncation at every offset, since a panic in a guest aborts the transaction rather than rejecting the package. Conformance against published vectors is M1-21. Asset identity has landed (M1-16), and it is a comparison between the caller's expectation and the registration rather than a property of the payload, because a RedStone package names a feed and nothing else -- ADR 16 records what that check does and does not establish. Value sanity has landed too (M1-17): zero, negative and unrepresentable values reject the payload immediately, even when other packages meet the threshold. Staleness has landed as well (M1-14, M1-15): every package for the requested feed must be inside the two-sided window, read from LEZ's pinned every-block clock account. ADR 15 records the strict package-level contract. M1-21 conforms the decoder against payloads captured from RedStone's gateway, using their own signatures as the oracle: a signature recovers to the address they published only if the signed span matches theirs byte for byte, and a negative control shows seven plausible wrong spans recovering nobody. The envelope is covered separately, because it carries no signature and the gateway serves per-signer JSON rather than a finished payload: `sample-data/payload.hex` from the Rust SDK is vendored, and `an_envelope_redstone_published_decodes_and_every_package_in_it_recovers` asserts it decodes and that all fifteen packages recover. The EVM connector is BUSL and is not read. ADR 19 records why the two sources answer different questions."

