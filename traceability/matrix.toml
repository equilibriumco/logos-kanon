# ---------------------------------------------------------------- Adaptor Security

[[row]]
id = "SEC1"
status = "partial"
tasks = ["M1-13", "M1-22", "M2-13", "M3-03"]
implemented_in = ["verifier-core"]
verified_by = [
  "test:an_unknown_signer_is_skipped_and_the_payload_still_verifies",
  "test:unauthorised_is_reported_when_the_skipped_signers_would_have_made_quorum",
]
note = "Both modes, one implementation: the membership check lives in `verifier-core`, so push and pull cannot diverge on who is authorised. The rule is count-and-ignore per ADR 15, not strict rejection: an unknown signer is skipped rather than failing the payload, and only named `UnauthorisedSigner` once the skipped signers would themselves have reached quorum -- a reader expecting strict rejection would otherwise read this row as unmet."

