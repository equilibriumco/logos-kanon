# The push-mode aggregator: the instruction set, the feed state it keeps, and
# the logic each instruction runs.
#
# The SPEL program itself is the guest binary under `methods/guest/src/bin/`,
# because that is what LEZ executes. This crate is what the guest delegates to,
# which is what makes the logic testable on the host, and it follows the shape
# Logos's own programs use: an instruction enum and `#[account_type]` state here,
# the `#[lez_program]` module there.
[package]
name = "aggregator-program"
description = "Push-mode LEZ aggregator: verifies RedStone packages and writes the canonical price account"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
verifier-core.workspace = true

# The canonical price account this program exists to populate, and the
# `AccountId` its identifier fields are made of. Through `kanon-idl` rather than
# from upstream directly, so "re-exported, not forked" has one place it happens.
kanon-idl.workspace = true

# `#[account_type]`, which marks the state types the IDL generator publishes,
# and the derives the instruction enum and account state need on the wire.
spel-framework-macros.workspace = true
# For the IDL generator binary: the macro expands to a `main` that refers to the
# framework by name. Without its `host` feature, which would pull in a LEZ node.
spel-framework.workspace = true
borsh = { workspace = true, features = ["derive"] }
serde = { workspace = true }

# A binary rather than an example, so `tests/idl.rs` can reach it through
# `CARGO_BIN_EXE_generate-idl` and assert the committed artefact is current. An
# example is not addressable that way, which would leave the check to CI alone.
[[bin]]
name = "generate-idl"
path = "src/bin/generate-idl.rs"

[dev-dependencies]
serde_json = "1"
