# The one verification implementation. It is callable both from the push
# aggregator and from a third-party consumer program, so a single audited
# implementation backs both modes: that is this crate's reason to exist, and the
# reason it depends on neither.
#
# `no_std`, asserted in CI by building for a bare-metal target rather
# than by convention. It runs inside a RISC Zero guest, where `std` is
# available but unnecessary; keeping it out means the same code can be linked
# by a consumer program that does without it.
[package]
name = "verifier-core"
description = "RedStone data-package verification: decode, ECDSA recovery, keccak256, M-of-N threshold, staleness and value bounds"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Exposes `test_support`, the signed-payload builder `decode` and `feed` use in
# their own unit tests, to other crates' tests. Off by default and never enabled
# by a shipped crate: it turns on `extern crate std` in a `no_std` library and
# pulls in a signing key, neither of which belongs in a guest.
#
# It exists because two tasks need a payload nobody captured. M2-16 needs a
# package carrying a zero or negative value, which cannot be signed by RedStone
# and so cannot be captured. M2-19 needs one timestamped *now*: the committed
# captures are weeks old and `MAX_MAX_AGE_MS` is fifteen minutes, so no captured
# payload can pass freshness against a live chain clock. Both need to sign their
# own, and this is the builder that already does it correctly.
#
# The alternative was a second builder in each consumer, which is how two
# implementations of one wire format start.
test-fixtures = []

[dependencies]
# The two primitives, and the same versions the cost baseline measured -- exact
# recovery cost is scalar-dependent and a patch release moves the figures. In a
# guest workspace these are replaced by RISC Zero's accelerated forks through
# `[patch.crates-io]`; the source here does not change, which is what made the
# software / accelerated / mixed comparison a comparison rather than three
# different programs.
k256 = { version = "=0.13.3", default-features = false, features = ["ecdsa", "arithmetic"] }
tiny-keccak = { version = "=2.0.2", features = ["keccak"] }

[dev-dependencies]
# Reading the committed RedStone vectors. Both already resolve in this graph, so
# neither adds a version to the tree.
serde_json = "1.0.151"
hex = "0.4"

# The generated invariants in `src/properties.rs`. Shrinking is the half of
# property testing a hand-rolled loop does not give: a failing 700-byte payload
# is not a bug report until something has reduced it.
#
# Already in this graph through `alloy-primitives`, reached from LEZ, so this
# resolves to the same version and adds no crate to the lockfile.
#
# `handle-panics` in place of the default `fork`. One of the two is required,
# because the property that matters most here is that guest-reachable code does
# not panic (ADR 4) and without either feature a panicking case aborts the run
# instead of shrinking to the input that caused it. `handle-panics` does that in
# process; `fork` runs every case in a subprocess and brings `rusty-fork`,
# `tempfile` and `wait-timeout` with it.
proptest = { version = "1.11.0", default-features = false, features = ["std", "handle-panics"] }
